<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SGOC XR - RECORRIDO 20 DE JULIO</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
        #ayuda {
            position: absolute; bottom: 10px; left: 10px; color: #fff;
            font-family: sans-serif; font-size: 13px; background: rgba(0,0,0,.5);
            padding: 8px 12px; border-radius: 8px; line-height: 1.5; max-width: 320px;
        }
    </style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="ayuda">
    <b>Prueba en computador:</b> clic sobre la pantalla y arrastra el mouse para mirar alrededor.
    Muevete con <b>W A S D</b> (o las flechas). En las gafas: boton "Entrar en VR",
    joystick derecho para caminar/girar.
</div>
<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

// ===== ALTURA DE OJOS Y TAMAÑO DE LA PERSONA (ajustar aqui si hace falta) =====
const alturaOjos = 1.6;          // metros desde el piso hasta los ojos
const anchoCuerpo = 0.30;        // medio-ancho de la "capsula" de colision (que tan cerca puede acercarse a una pared)
const velocidadCaminar = 0.9;    // velocidad al caminar con teclado o joystick (metros por "paso" de render)
const medioAltoCapsula = alturaOjos / 2; // mitad de la altura de la "capsula" de colision (no cambiar: se calcula sola)

const createScene = async function () {
    const scene = new BABYLON.Scene(engine);
    scene.collisionsEnabled = true;
    scene.gravity = new BABYLON.Vector3(0, -0.98, 0);
    scene.clearColor = new BABYLON.Color4(0.62, 0.76, 0.9, 1); // cielo azul claro provisional (se puede cambiar despues por un Sky Texture)

    // Luz
    const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 1.1;
    light.groundColor = new BABYLON.Color3(0.5, 0.5, 0.5);

    // ===== CARGAR EDIFICIO A ESCALA REAL (1:1, sin achicar como en la maqueta) =====
    const result = await BABYLON.SceneLoader.ImportMeshAsync("", "./", "UNITROPICO.glb", scene);
    console.log("EDIFICIO CARGADO (recorrido)", result);
    result.meshes.forEach(mesh => { mesh.checkCollisions = true; });

    // Encuadrar el edificio (mismo metodo que la maqueta: descarta piezas sueltas/lejanas para calcular el centro real)
    const candidatos = result.meshes.filter(m => m.getTotalVertices && m.getTotalVertices() > 0);
    const centros = candidatos.map(m => m.getBoundingInfo().boundingBox.centerWorld);
    const xs = centros.map(c => c.x).sort((a, b) => a - b);
    const ys = centros.map(c => c.y).sort((a, b) => a - b);
    const zs = centros.map(c => c.z).sort((a, b) => a - b);
    const medio = a => a[Math.floor(a.length / 2)];
    const centroPrincipal = new BABYLON.Vector3(medio(xs), medio(ys), medio(zs));
    const meshesEdificio = candidatos.filter(m => {
        const c = m.getBoundingInfo().boundingBox.centerWorld;
        return (Math.abs(c.x - centroPrincipal.x) < 60 && Math.abs(c.y - centroPrincipal.y) < 60 && Math.abs(c.z - centroPrincipal.z) < 20);
    });
    const bounds = BABYLON.Mesh.MinMax(meshesEdificio);
    const center = BABYLON.Vector3.Center(bounds.min, bounds.max);
    const tamano = bounds.max.subtract(bounds.min);

    // ===== CENTRAR EL EDIFICIO Y PONER SU PISO EN Y=0 =====
    const edificioRoot = new BABYLON.TransformNode("edificioRoot", scene);
    result.meshes.filter(mesh => !mesh.parent).forEach(mesh => { mesh.parent = edificioRoot; });
    edificioRoot.position = new BABYLON.Vector3(-center.x, -bounds.min.y, -center.z);

    // ===== PUNTO DE PARTIDA: afuera, en la calle, frente al edificio =====
    const margenCalle = 6; // metros de distancia desde la fachada
    const posicionInicial = new BABYLON.Vector3(0, alturaOjos, -(tamano.z / 2 + margenCalle));
    const miradaInicial = new BABYLON.Vector3(0, alturaOjos, 0); // mirando hacia el edificio al arrancar

    // ===== CAMARA PARA PROBAR EN COMPUTADOR (WASD + mouse) =====
    const camera = new BABYLON.UniversalCamera("cameraRecorrido", posicionInicial.clone(), scene);
    camera.setTarget(miradaInicial); // arranca mirando hacia el edificio, no hacia la calle
    camera.minZ = 0.05;
    camera.speed = velocidadCaminar * 0.35;
    camera.angularSensibility = 4000;
    camera.checkCollisions = true;
    camera.applyGravity = true;
    camera.ellipsoid = new BABYLON.Vector3(anchoCuerpo, medioAltoCapsula, anchoCuerpo);
    camera.ellipsoidOffset = new BABYLON.Vector3(0, -medioAltoCapsula, 0);
    // OJO: a proposito NO usamos camera.keysUp/keysDown/etc (las teclas por
    // defecto de Babylon), porque esas mueven exactamente hacia donde miras,
    // incluso hacia arriba - eso era lo que te mandaba volando al cielo si
    // mirabas un poco hacia arriba y caminabas. Mas abajo usamos un control
    // de teclado propio que siempre mueve en plano horizontal, sin importar
    // hacia donde estes mirando (como en cualquier juego de caminar).
    camera.attachControl(canvas, true); // esto deja el mouse para mirar alrededor (arrastrando)

    // ===== TECLADO PROPIO PARA CAMINAR (W A S D / flechas) =====
    // Siempre mueve en plano horizontal, sin importar hacia donde mires con el
    // mouse (arriba/abajo). Es la misma logica que el joystick de las gafas.
    const teclasPresionadas = {};
    window.addEventListener("keydown", (e) => { teclasPresionadas[e.code] = true; });
    window.addEventListener("keyup", (e) => { teclasPresionadas[e.code] = false; });

    scene.onBeforeRenderObservable.add(() => {
        const adelante = camera.getDirection(BABYLON.Axis.Z);
        adelante.y = 0;
        adelante.normalize();
        const derecha = camera.getDirection(BABYLON.Axis.X);
        derecha.y = 0;
        derecha.normalize();

        const mover = BABYLON.Vector3.Zero();
        if (teclasPresionadas["KeyW"] || teclasPresionadas["ArrowUp"]) mover.addInPlace(adelante);
        if (teclasPresionadas["KeyS"] || teclasPresionadas["ArrowDown"]) mover.subtractInPlace(adelante);
        if (teclasPresionadas["KeyD"] || teclasPresionadas["ArrowRight"]) mover.addInPlace(derecha);
        if (teclasPresionadas["KeyA"] || teclasPresionadas["ArrowLeft"]) mover.subtractInPlace(derecha);

        if (mover.length() > 0) {
            mover.normalize();
            camera.cameraDirection.addInPlace(mover.scale(velocidadCaminar * 0.02));
        }
    });

    // ===== NITIDEZ: antialiasing y filtrado anisotropico (igual que en la maqueta) =====
    const pipeline = new BABYLON.DefaultRenderingPipeline("mejoraVisual", true, scene, [camera]);
    pipeline.samples = 4;
    pipeline.fxaaEnabled = true;
    result.meshes.forEach(mesh => {
        if (!mesh.material) return;
        const materiales = mesh.material.subMaterials || [mesh.material];
        materiales.forEach(mat => {
            if (!mat) return;
            if (mat.diffuseTexture) mat.diffuseTexture.anisotropicFilteringLevel = 8;
            if (mat.albedoTexture) mat.albedoTexture.anisotropicFilteringLevel = 8;
        });
    });

    // ===== VIÑETA ANTI-MAREO (prioridad #1 de realismo) =====
    pipeline.imageProcessing.vignetteEnabled = true;
    pipeline.imageProcessing.vignetteColor = new BABYLON.Color4(0, 0, 0, 1);
    pipeline.imageProcessing.vignetteWeight = 0;
    let intensidadLocomocion = 0;

    scene.onBeforeRenderObservable.add(() => {
        const objetivo = intensidadLocomocion > 0.15 ? 3.5 : 0;
        pipeline.imageProcessing.vignetteWeight += (objetivo - pipeline.imageProcessing.vignetteWeight) * 0.1;
    });

    // ===== WEBXR: recorrido inmersivo (se oculta la sala real, VR completa) =====
    try {
        const xr = await scene.createDefaultXRExperienceAsync({
            disableTeleportation: true,
            optionalFeatures: true,
            uiOptions: {
                sessionMode: "immersive-vr",
                referenceSpaceType: "local-floor"
            }
        });

        const xrCamera = xr.baseExperience.camera;
        xrCamera.checkCollisions = true;
        xrCamera.applyGravity = true;
        xrCamera.ellipsoid = new BABYLON.Vector3(anchoCuerpo, medioAltoCapsula, anchoCuerpo);
        xrCamera.ellipsoidOffset = new BABYLON.Vector3(0, -medioAltoCapsula, 0);
        pipeline.cameras.push(xrCamera);

        xr.baseExperience.onStateChangedObservable.add((state) => {
            if (state === BABYLON.WebXRState.IN_XR) {
                xrCamera.position.copyFrom(posicionInicial);
            }
        });

        let ejeCaminar = 0;
        let ejeGirar = 0;
        let ultimoGiro = 0;
        const anguloGiro = BABYLON.Tools.ToRadians(45);
        const pausaEntreGiros = 350;

        xr.input.onControllerAddedObservable.add((xrController) => {
            if (xrController.inputSource.handedness !== "right") return;
            xrController.onMotionControllerInitObservable.add((motionController) => {
                const joystick = motionController.getComponent("xr-standard-thumbstick");
                if (!joystick) return;
                joystick.onAxisValueChangedObservable.add((axes) => {
                    ejeCaminar = axes.y;
                    ejeGirar = axes.x;
                });
            });
        });

        scene.onBeforeRenderObservable.add(() => {
            if (Math.abs(ejeCaminar) > 0.15) {
                const forward = xrCamera.getDirection(BABYLON.Axis.Z);
                forward.y = 0;
                forward.normalize();
                xrCamera.cameraDirection.addInPlace(forward.scale(-ejeCaminar * velocidadCaminar * 0.01));
                intensidadLocomocion = Math.abs(ejeCaminar);
            } else {
                intensidadLocomocion = 0;
            }

            const ahora = performance.now();
            if (Math.abs(ejeGirar) > 0.6 && (ahora - ultimoGiro) > pausaEntreGiros) {
                const sentido = ejeGirar > 0 ? 1 : -1;
                const rot = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Y, anguloGiro * sentido);
                xrCamera.rotationQuaternion = rot.multiply(xrCamera.rotationQuaternion);
                ultimoGiro = ahora;
            }
        });

        console.log("SGOC XR - RECORRIDO ACTIVO");
    } catch (error) {
        console.log("WebXR no disponible en este dispositivo", error);
    }

    return scene;
};

createScene().then(scene => {
    engine.runRenderLoop(function () { scene.render(); });
});

window.addEventListener("resize", function () { engine.resize(); });
</script>
</body>
</html>

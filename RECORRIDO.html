<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SGOC XR - RECORRIDO 20 DE JULIO</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
        #ayuda {
            position: absolute; bottom: 10px; left: 10px; color: #fff;
            font-family: sans-serif; font-size: 13px; background: rgba(0,0,0,.5);
            padding: 8px 12px; border-radius: 8px; line-height: 1.5; max-width: 320px;
        }
    </style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="ayuda">
    <b>Prueba en computador:</b> clic sobre la pantalla y arrastra el mouse para mirar alrededor.
    Muevete con <b>W A S D</b> (o las flechas). En las gafas: boton "Entrar en VR",
    joystick derecho para caminar/girar.
</div>
<script>
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);

// ===== ALTURA DE OJOS Y TAMAÑO DE LA PERSONA (ajustar aqui si hace falta) =====
const alturaOjos = 1.6;          // metros desde el piso hasta los ojos
const anchoCuerpo = 0.30;        // medio-ancho de la "capsula" de colision (que tan cerca puede acercarse a una pared)
const velocidadCaminar = 0.9;    // velocidad al caminar con teclado o joystick (metros por "paso" de render)
const medioAltoCapsula = 0.75;   // mitad de la altura de la "capsula" de colision
const alturaEscalonMax = 0.45;   // hasta cuantos metros de "escaloncito" (anden, borde, grada baja) se puede pasar sin que la capsula lo trate como pared
const offsetCapsulaY = alturaEscalonMax - alturaOjos + medioAltoCapsula; // deja la capsula levantada del piso justo esa altura (no cambiar: se calcula sola)

const createScene = async function () {
    const scene = new BABYLON.Scene(engine);
    scene.collisionsEnabled = true;
    scene.gravity = new BABYLON.Vector3(0, -0.98, 0);
    scene.clearColor = new BABYLON.Color4(0.62, 0.76, 0.9, 1); // cielo azul claro provisional (se puede cambiar despues por un Sky Texture)

    // Luz
    const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
    light.intensity = 1.1;
    light.groundColor = new BABYLON.Color3(0.5, 0.5, 0.5);

    // ===== CARGAR EDIFICIO A ESCALA REAL (1:1, sin achicar como en la maqueta) =====
    const result = await BABYLON.SceneLoader.ImportMeshAsync("", "./", "UNITROPICO.glb", scene);
    console.log("EDIFICIO CARGADO (recorrido)", result);
    result.meshes.forEach(mesh => { mesh.checkCollisions = true; });

    // Encuadrar el edificio (mismo metodo que la maqueta: descarta piezas sueltas/lejanas para calcular el centro real)
    const candidatos = result.meshes.filter(m => m.getTotalVertices && m.getTotalVertices() > 0);
    const centros = candidatos.map(m => m.getBoundingInfo().boundingBox.centerWorld);
    const xs = centros.map(c => c.x).sort((a, b) => a - b);
    const ys = centros.map(c => c.y).sort((a, b) => a - b);
    const zs = centros.map(c => c.z).sort((a, b) => a - b);
    const medio = a => a[Math.floor(a.length / 2)];
    const centroPrincipal = new BABYLON.Vector3(medio(xs), medio(ys), medio(zs));
    const meshesEdificio = candidatos.filter(m => {
        const c = m.getBoundingInfo().boundingBox.centerWorld;
        return (Math.abs(c.x - centroPrincipal.x) < 60 && Math.abs(c.y - centroPrincipal.y) < 60 && Math.abs(c.z - centroPrincipal.z) < 20);
    });
    const bounds = BABYLON.Mesh.MinMax(meshesEdificio);
    const center = BABYLON.Vector3.Center(bounds.min, bounds.max);
    const tamano = bounds.max.subtract(bounds.min);

    // ===== RED DE SEGURIDAD =====
    // Si por cualquier motivo la camara sale disparada (mucho mas arriba del
    // techo del edificio, o se cae mucho mas abajo del piso), la regresamos
    // sola al punto de partida en vez de dejarla perdida en el cielo.
    const techoSeguridad = tamano.y + 15;
    const pisoSeguridad = -5;

    // ===== CENTRAR EL EDIFICIO Y PONER SU PISO EN Y=0 =====
    // Asi, cuando uno "entra en VR" parado en el piso real, queda parado sobre
    // el piso del edificio (primer piso). Es la misma logica de piso-en-cero
    // que usamos en la maqueta, pero aqui a tamaño real (sin achicar nada).
    const edificioRoot = new BABYLON.TransformNode("edificioRoot", scene);
    result.meshes.filter(mesh => !mesh.parent).forEach(mesh => { mesh.parent = edificioRoot; });
    edificioRoot.position = new BABYLON.Vector3(-center.x, -bounds.min.y, -center.z);

    // ===== PISO DE RESPALDO (invisible) =====
    // Por si el visitante camina hacia afuera del edificio (la calle, el
    // anden) y ahi el modelo no tiene geometria de piso: sin esto, el rayo
    // de "altura del piso" (mas abajo) no encontraria nada y la camara se
    // quedaria sin saber donde pisar.
    const pisoRespaldo = BABYLON.MeshBuilder.CreateGround("pisoRespaldo", { width: 500, height: 500 }, scene);
    pisoRespaldo.position.y = 0;
    pisoRespaldo.isVisible = false;
    pisoRespaldo.checkCollisions = true;

    // ===== ALTURA DEL PISO POR RAYO (reemplaza la gravedad de Babylon) =====
    // En vez de dejar que la gravedad "empuje" a la camara contra el piso
    // cuadro a cuadro (que es lo que probablemente causaba el "disparo al
    // cielo" - es comun que un piso exportado de Blender tenga mas de una
    // capa de geometria casi pegada, y eso confunde la fisica de Babylon),
    // medimos con un rayo hacia abajo la altura real del piso justo debajo
    // de la camara, y la colocamos ahi directamente. Esto tambien hace que
    // subir escaleras se sienta suave, sin depender de fisica de gravedad.
    function alturaDelPiso(x, z) {
        const origen = new BABYLON.Vector3(x, 1000, z);
        const rayo = new BABYLON.Ray(origen, BABYLON.Vector3.Down(), 2000);
        const hit = scene.pickWithRay(rayo, (mesh) => mesh.checkCollisions);
        if (hit && hit.hit) return hit.pickedPoint.y;
        return null;
    }

    // ===== PUNTO DE PARTIDA: afuera, en la calle, frente al edificio =====
    // La idea es empezar el recorrido DESDE AFUERA (para caminar alrededor,
    // ver fachadas, ventanas, piso/andén) y luego entrar por la puerta principal.
    // Como todavia no sabemos hacia donde mira exactamente la entrada principal
    // dentro del archivo, por ahora arrancamos a unos metros de uno de los lados
    // del edificio (no en el centro/adentro). ES UN PRIMER INTENTO:
    // prueba en el computador, y si apareces adentro, metido en una pared, o
    // mirando hacia el lado contrario a la entrada, dime hacia que lado hay que
    // moverlo (adelante/atras/izquierda/derecha) y lo ajusto exacto.
    const margenCalle = 6; // metros de distancia desde la fachada
    const posicionInicial = new BABYLON.Vector3(0, alturaOjos, -(tamano.z / 2 + margenCalle));
    const miradaInicial = new BABYLON.Vector3(0, alturaOjos, 0); // mirando hacia el edificio al arrancar

    // ===== CAMARA PARA PROBAR EN COMPUTADOR (WASD + mouse) =====
    const camera = new BABYLON.UniversalCamera("cameraRecorrido", posicionInicial.clone(), scene);
    camera.setTarget(miradaInicial); // arranca mirando hacia el edificio, no hacia la calle
    camera.minZ = 0.05;
    camera.speed = velocidadCaminar * 0.35; // el "speed" de teclado se siente mas rapido que el mismo numero en el joystick
    camera.angularSensibility = 4000;
    // OJO: a proposito applyGravity queda en FALSE (no usamos la gravedad de
    // Babylon - ver "ALTURA DEL PISO POR RAYO" arriba). checkCollisions
    // queda en TRUE solo para no atravesar paredes (el rayo de arriba se
    // encarga de la altura/piso/escaleras por separado).
    camera.checkCollisions = true;
    camera.applyGravity = false;
    camera.ellipsoid = new BABYLON.Vector3(anchoCuerpo, medioAltoCapsula, anchoCuerpo);
    camera.ellipsoidOffset = new BABYLON.Vector3(0, offsetCapsulaY, 0); // deja la capsula un poco levantada del piso (ver alturaEscalonMax arriba)
    camera.attachControl(canvas, true); // esto deja el mouse para mirar alrededor (arrastrando)
    // Quitamos por completo el control de teclado que trae Babylon de fabrica
    // (el de las flechas), porque ese mueve exactamente hacia donde miras,
    // incluso hacia arriba - eso era una de las causas de salir disparado al
    // cielo si mirabas un poco hacia arriba y caminabas. Mas abajo ponemos
    // nuestro propio control de teclado, que siempre mueve en plano
    // horizontal (como en cualquier juego de caminar), tanto para W A S D
    // como para las flechas.
    camera.inputs.removeByType("FreeCameraKeyboardMoveInput");
    let primerAjusteAltura = true;

    // ===== TECLADO PROPIO PARA CAMINAR (W A S D / flechas) =====
    // Siempre mueve en plano horizontal, sin importar hacia donde mires con el
    // mouse (arriba/abajo). Es la misma logica que el joystick de las gafas.
    const teclasPresionadas = {};
    window.addEventListener("keydown", (e) => { teclasPresionadas[e.code] = true; });
    window.addEventListener("keyup", (e) => { teclasPresionadas[e.code] = false; });

    scene.onBeforeRenderObservable.add(() => {
        const adelante = camera.getDirection(BABYLON.Axis.Z);
        adelante.y = 0;
        adelante.normalize();
        const derecha = camera.getDirection(BABYLON.Axis.X);
        derecha.y = 0;
        derecha.normalize();

        const mover = BABYLON.Vector3.Zero();
        if (teclasPresionadas["KeyW"] || teclasPresionadas["ArrowUp"]) mover.addInPlace(adelante);
        if (teclasPresionadas["KeyS"] || teclasPresionadas["ArrowDown"]) mover.subtractInPlace(adelante);
        if (teclasPresionadas["KeyD"] || teclasPresionadas["ArrowRight"]) mover.addInPlace(derecha);
        if (teclasPresionadas["KeyA"] || teclasPresionadas["ArrowLeft"]) mover.subtractInPlace(derecha);

        if (mover.length() > 0) {
            mover.normalize();
            camera.cameraDirection.addInPlace(mover.scale(velocidadCaminar * 0.02));
        }

        // Pisar el suelo real (ver "ALTURA DEL PISO POR RAYO" arriba)
        const pisoY = alturaDelPiso(camera.position.x, camera.position.z);
        if (pisoY !== null) {
            const objetivoY = pisoY + alturaOjos;
            if (primerAjusteAltura) {
                camera.position.y = objetivoY; // de una vez, sin animacion, al arrancar
                primerAjusteAltura = false;
            } else {
                camera.position.y += (objetivoY - camera.position.y) * 0.25; // suave, para que subir un escalon no se sienta brusco
            }
        }

        // Red de seguridad (ver arriba)
        if (camera.position.y > techoSeguridad || camera.position.y < pisoSeguridad) {
            camera.position.copyFrom(posicionInicial);
            camera.cameraDirection.setAll(0);
            primerAjusteAltura = true;
        }
    });

    // ===== NITIDEZ: antialiasing y filtrado anisotropico (igual que en la maqueta) =====
    const pipeline = new BABYLON.DefaultRenderingPipeline("mejoraVisual", true, scene, [camera]);
    pipeline.samples = 4;
    pipeline.fxaaEnabled = true;
    result.meshes.forEach(mesh => {
        if (!mesh.material) return;
        const materiales = mesh.material.subMaterials || [mesh.material];
        materiales.forEach(mat => {
            if (!mat) return;
            if (mat.diffuseTexture) mat.diffuseTexture.anisotropicFilteringLevel = 8;
            if (mat.albedoTexture) mat.albedoTexture.anisotropicFilteringLevel = 8;
        });
    });

    // ===== VIÑETA ANTI-MAREO (prioridad #1 de realismo) =====
    // Se enciende sola mientras el joystick esta moviendo al usuario (locomocion),
    // y se apaga cuando esta quieto o solo caminando fisicamente (eso no marea).
    pipeline.imageProcessing.vignetteEnabled = true;
    pipeline.imageProcessing.vignetteColor = new BABYLON.Color4(0, 0, 0, 1);
    pipeline.imageProcessing.vignetteWeight = 0;
    let intensidadLocomocion = 0; // la actualiza el joystick de las gafas mas abajo

    scene.onBeforeRenderObservable.add(() => {
        const objetivo = intensidadLocomocion > 0.15 ? 3.5 : 0;
        pipeline.imageProcessing.vignetteWeight += (objetivo - pipeline.imageProcessing.vignetteWeight) * 0.1;
    });

    // ===== WEBXR: recorrido inmersivo (se oculta la sala real, VR completa) =====
    try {
        const xr = await scene.createDefaultXRExperienceAsync({
            disableTeleportation: true,       // no usamos teletransporte: caminata fisica + joystick
            optionalFeatures: true,
            uiOptions: {
                sessionMode: "immersive-vr",       // VR completa: no se ve la sala real (distinto de la maqueta, que es AR)
                referenceSpaceType: "local-floor"  // el piso real (donde esta parado el cliente) = piso del edificio
            }
        });

        const xrCamera = xr.baseExperience.camera;
        // Igual que con la camara de escritorio: nada de gravedad de Babylon,
        // solo colision (paredes) + el rayo de altura del piso (ver arriba).
        xrCamera.checkCollisions = true;
        xrCamera.applyGravity = false;
        xrCamera.ellipsoid = new BABYLON.Vector3(anchoCuerpo, medioAltoCapsula, anchoCuerpo);
        xrCamera.ellipsoidOffset = new BABYLON.Vector3(0, offsetCapsulaY, 0);
        pipeline.cameras.push(xrCamera); // la nitidez y la viñeta tambien aplican en las gafas
        let primerAjusteAlturaXR = true;

        // Punto de partida al entrar en VR (se reubica cada vez que arranca la sesion,
        // por si el cliente ya habia caminado con el modo escritorio antes de ponerse las gafas)
        xr.baseExperience.onStateChangedObservable.add((state) => {
            if (state === BABYLON.WebXRState.IN_XR) {
                xrCamera.position.copyFrom(posicionInicial);
                primerAjusteAlturaXR = true;
            }
        });

        // ----- Joystick derecho: caminar (adelante/atras) y girar (izquierda/derecha) -----
        let ejeCaminar = 0;   // adelante/atras
        let ejeGirar = 0;     // izquierda/derecha
        let ultimoGiro = 0;   // para el "snap turn" (giro en saltos, no continuo: marea menos)
        const anguloGiro = BABYLON.Tools.ToRadians(45);
        const pausaEntreGiros = 350; // milisegundos

        xr.input.onControllerAddedObservable.add((xrController) => {
            if (xrController.inputSource.handedness !== "right") return;
            xrController.onMotionControllerInitObservable.add((motionController) => {
                const joystick = motionController.getComponent("xr-standard-thumbstick");
                if (!joystick) return;
                joystick.onAxisValueChangedObservable.add((axes) => {
                    ejeCaminar = axes.y;
                    ejeGirar = axes.x;
                });
            });
        });

        scene.onBeforeRenderObservable.add(() => {
            // Caminar suave hacia donde mira la cabeza (usa la misma camara/colision/gravedad que el modo escritorio)
            if (Math.abs(ejeCaminar) > 0.15) {
                const forward = xrCamera.getDirection(BABYLON.Axis.Z);
                forward.y = 0;
                forward.normalize();
                xrCamera.cameraDirection.addInPlace(forward.scale(-ejeCaminar * velocidadCaminar * 0.01));
                intensidadLocomocion = Math.abs(ejeCaminar);
            } else {
                intensidadLocomocion = 0;
            }

            // Giro por saltos (snap turn) — mas comodo que girar continuo con el joystick
            const ahora = performance.now();
            if (Math.abs(ejeGirar) > 0.6 && (ahora - ultimoGiro) > pausaEntreGiros) {
                const sentido = ejeGirar > 0 ? 1 : -1;
                const rot = BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Y, anguloGiro * sentido);
                xrCamera.rotationQuaternion = rot.multiply(xrCamera.rotationQuaternion);
                ultimoGiro = ahora;
            }

            // Pisar el suelo real (ver "ALTURA DEL PISO POR RAYO" arriba)
            const pisoYxr = alturaDelPiso(xrCamera.position.x, xrCamera.position.z);
            if (pisoYxr !== null) {
                const objetivoYxr = pisoYxr + alturaOjos;
                if (primerAjusteAlturaXR) {
                    xrCamera.position.y = objetivoYxr;
                    primerAjusteAlturaXR = false;
                } else {
                    xrCamera.position.y += (objetivoYxr - xrCamera.position.y) * 0.25;
                }
            }

            // Red de seguridad (ver arriba)
            if (xrCamera.position.y > techoSeguridad || xrCamera.position.y < pisoSeguridad) {
                xrCamera.position.copyFrom(posicionInicial);
                xrCamera.cameraDirection.setAll(0);
                primerAjusteAlturaXR = true;
            }
        });

        console.log("SGOC XR - RECORRIDO ACTIVO");
    } catch (error) {
        console.log("WebXR no disponible en este dispositivo", error);
    }

    return scene;
};

createScene().then(scene => {
    engine.runRenderLoop(function () { scene.render(); });
});

window.addEventListener("resize", function () { engine.resize(); });
</script>
</body>
</html>
